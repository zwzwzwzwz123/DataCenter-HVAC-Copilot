[project]
name = "datacenter-hvac-copilot"
version = "0.1.0"
description = "RAG + Agent + tools scaffold for BEAR-based data center HVAC analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "langgraph>=1.2",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.5",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "pypdf>=4.2",
    "streamlit>=1.37",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.8",
]
dense = [
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "BEAR",
    "models/dropt/main_building_fno_guided_bcfix_clean.py",
]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E402", "E501", "B905"]
