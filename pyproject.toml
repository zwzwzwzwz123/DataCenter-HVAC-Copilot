[project]
name = "datacenter-hvac-copilot"
version = "0.1.0"
description = "RAG + Agent + tools scaffold for BEAR-based data center HVAC analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "langgraph>=1.2",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.5",
    "streamlit>=1.37",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
dense = [
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
