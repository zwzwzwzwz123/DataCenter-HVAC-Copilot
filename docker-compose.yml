services:
  api:
    build: .
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_TIMEOUT_SECONDS: "30"
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LANGGRAPH_PLANNER_PROVIDER: ${LANGGRAPH_PLANNER_PROVIDER:-auto}
      LANGGRAPH_PLANNER_MODEL: ${LANGGRAPH_PLANNER_MODEL:-deepseek-chat}
      LANGGRAPH_PLANNER_TIMEOUT_SECONDS: ${LANGGRAPH_PLANNER_TIMEOUT_SECONDS:-20}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-60}

  streamlit:
    build: .
    command: streamlit run app/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      HVAC_COPILOT_API_BASE_URL: http://api:8000
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_TIMEOUT_SECONDS: "30"
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LANGGRAPH_PLANNER_PROVIDER: ${LANGGRAPH_PLANNER_PROVIDER:-auto}
      LANGGRAPH_PLANNER_MODEL: ${LANGGRAPH_PLANNER_MODEL:-deepseek-chat}
      LANGGRAPH_PLANNER_TIMEOUT_SECONDS: ${LANGGRAPH_PLANNER_TIMEOUT_SECONDS:-20}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-60}
    depends_on:
      - api
